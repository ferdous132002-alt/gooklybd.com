@keyframes gx{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes fin{from{opacity:0}to{opacity:1}}
.bl{position:absolute;border-radius:50%;filter:blur(55px);opacity:.5;animation:fl 9s ease-in-out infinite}
.b1{width:280px;height:280px;background:#a5d6a7;top:-70px;left:-70px}.b2{width:320px;height:320px;background:#ffd54f;bottom:-90px;right:-70px;animation-delay:-3s}.b3{width:200px;height:200px;background:#4dd0e1;top:45%;left:55%;animation-delay:-6s}
@keyframes fl{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-40px) scale(1.12)}}

<script>
const D=JSON.parse(document.getElementById('data').textContent);
if(!D.cats)D.cats=[...new Set(D.products.map(p=>p.cat).filter(Boolean))].map(n=>({name:n,icon:'🌿'}));
let curUser='',authed=false,cat='সব',bi=0,view=null,tab='p',dirty=false,fm={n:'',p:'',e:'',a:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tk=n=>'৳'+Number(n||0).toLocaleString('bn-BD');
const pic=p=>p.img?`<img src="${esc(p.img)}" alt="">`:`<span class="ph">${esc(p.emoji||'🌿')}</span>`;
const waUrl=m=>{let n=String(D.shop.phone).replace(/\D/g,'');if(n[0]==='0')n='88'+n;return 'https://wa.me/'+n+'?text='+encodeURIComponent(m)};
const cats=()=>['সব',...D.cats.map(c=>c.name)];
const ico=n=>n==='সব'?'🛍️':((D.cats.find(c=>c.name===n)||{}).icon||'');

function store(){
  const S=D.shop,ps=D.products.filter(p=>cat==='সব'||p.cat===cat),v=D.products.find(p=>p.id===view);
  $('#app').innerHTML=`
  <header><b class="logo">${S.logoImg?`<img class="hl" src="${esc(S.logoImg)}" alt="">`:esc(S.logo)} ${esc(S.name)}</b><div>${authed?'<button onclick="openAdmin()">⚙️ অ্যাডমিন</button>':''}</div></header>
  <section id="bn"></section>
  <div class="trust"><span>${esc(S.t1||'')}</span><span>${esc(S.t2||'')}</span><span>${esc(S.t3||'')}</span></div>
  <div class="chips">${cats().map(c=>`<button class="${c===cat?'on':''}" onclick="setCat(this.dataset.c)" data-c="${esc(c)}"><i>${esc(ico(c))}</i>${esc(c)}</button>`).join('')}</div>
  <div class="sec"><h2>${esc(S.sectionTitle||'আমাদের পণ্য')}</h2></div>
  <main class="grid">${ps.map((p,ix)=>`<div class="card" style="--i:${ix}"><div class="pic" style="cursor:pointer" onclick="openP(${p.id})">${pic(p)}${p.old>p.price?`<span class="off">-${Math.round((1-p.price/p.old)*100)}%</span>`:''}</div>
   <div class="info"><h3>${esc(p.name)}</h3><div class="price">${tk(p.price)}${p.old>p.price?`<s>${tk(p.old)}</s>`:''}</div>
   <button class="btn wa" onclick="openP(${p.id})">${esc(S.btnOrder)}</button>
   </div></div>`).join('')||'<p>কোনো পণ্য নেই</p>'}</main>
  <footer><b>${esc(S.name)}</b><br>${esc(S.tagline)}<br>📍 ${esc(S.address)} · 📞 ${esc(S.phone)} · ✉️ ${esc(S.email)}${S.mapUrl&&S.mapUrl.startsWith('http')?` · <a href="${esc(S.mapUrl)}" target="_blank" rel="noopener" style="color:var(--pr)">🗺️ ম্যাপে দেখুন</a>`:''}<br><a href="#" onclick="loginBox();return false" style="color:var(--mu);font-size:.8rem">🔐 ${esc(S.adminLink)}</a></footer>
  <a class="fab btn wa" target="_blank" rel="noopener" href="${esc(waUrl('আসসালামু আলাইকুম, আমি কিছু জানতে চাই'))}">💬 ${esc(S.fab)}</a>
  <div class="drawer ${v?'open':''}" onclick="if(event.target===this)closeP()"><div class="panel">${v?detail(v):''}</div></div>`;
  banner();
}
function setCat(c){cat=c;store()}
function banner(){
